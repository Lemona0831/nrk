<style>
:root{color-scheme:dark;--bg:#0d0b0a;--panel:#17120f;--panel2:#211a15;--line:#3a2c22;--ink:#e6dccb;--muted:#a39380;--gold:#c9a24b;--gold-ink:#1a1206;--good:#86c56f;--bad:#ea6a55;--hp:#c9483a;--mp:#3f7ad6;--st:#c9a23a;--bk:#9b78e0;--track:#2a1f1a;--blood:#b33a2e;--gr-n:#b9b2a6;--gr-m:#79a6e0;--gr-r:#e0b24a;

.setg{border-top:1px solid var(--line);padding:12px 0 6px}.setg:first-of-type{border-top:0;padding-top:2px}.setg h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-family:inherit;letter-spacing:.06em;text-shadow:none}
.sw{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:4px 12px 4px 6px;border-radius:999px;font-size:13.5px}.sw::before{content:'';width:34px;height:20px;border-radius:10px;background:radial-gradient(circle at 10px 50%,var(--muted) 6px,transparent 7px),var(--track);box-shadow:inset 0 0 0 1px var(--line)}.sw[aria-checked=true]::before{background:radial-gradient(circle at 24px 50%,#1a1206 6px,transparent 7px),var(--gold);box-shadow:none}.sw[aria-checked=false]{color:var(--muted)}
.setrow{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;margin:6px 0;min-height:40px}.setrow>label,.setrow>.lab{font-size:14px}.setrow>:last-child{justify-self:end}.setrow small{grid-column:1/-1;justify-self:start!important;margin-top:-4px;color:var(--muted);font-size:12px}.setrow input[type=range]{flex:1;min-width:0;accent-color:var(--gold);min-height:36px}.setrow output{min-width:42px;text-align:right;font-variant-numeric:tabular-nums}.setrow select{flex:1;min-height:36px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 12px;margin:0 -12px 10px;display:flex;align-items:center;gap:10px}
.hdr .hi{font-size:13px;color:var(--gold);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hdr .hi-d{margin-right:6px;vertical-align:middle}.hdr .hi-m{display:none}.hdr .hl{flex:1;min-width:0}.hdr .hl b{font-family:'Nanum Myeongjo',serif;font-size:17px;display:block}

.ccard{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--panel2)}.ccard .big{font-size:28px}

.bar.hp i{background:var(--hp)}.bar.mp i{background:var(--mp)}.bar.st i{background:var(--st)}.bar.bk i{background:var(--bk)}
.bars3{display:grid;gap:3px;margin:8px 0}

.en{background:var(--panel);text-align:left;padding:8px;display:block;width:100%}
.en.tg{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.en .ico{font-size:22px;flex:0 0 auto}.en .nm{font-weight:600;font-size:13.5px}.en .bar{height:12px}.en .bar span{font-size:9.5px;line-height:11px}
.intent{font-size:12.5px;margin-top:4px;padding:3px 6px;border-radius:5px;background:var(--panel2);border:1px solid var(--line)}.intent.hv{border-color:var(--bad);color:var(--bad);font-weight:600}
.sts{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.sts i{font-style:normal;font-size:11.5px;border:1px solid;border-radius:4px;padding:0 4px}.sts .b{border-color:var(--good);color:var(--good)}.sts .d{border-color:var(--bad);color:var(--bad)}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:6px}
.skills button{text-align:left;padding:8px}.skills small{display:block;color:var(--muted);font-size:12px;line-height:1.35}

.blog p{margin:0 0 3px}.blog .bad{color:var(--bad)}.blog .good{color:var(--good)}.blog .crit{color:var(--gold);font-weight:600}.blog .sys{color:var(--muted)}
.icard{border:1px solid var(--gold);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.icard .in{font-family:'Nanum Myeongjo',serif;font-size:17px;color:var(--gold)}.icard .l{margin:3px 0;font-size:14px}.icard .act{font-weight:600}.icard .cost{color:var(--bad)}
.icard button{margin-top:6px;width:100%}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-top:4px}
.tbl{overflow-x:auto}
table.st2{width:100%;border-collapse:collapse;font-size:13px}table.st2 td,table.st2 th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-end;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{background:var(--bg);border-top:2px solid var(--gold);width:100%;max-width:760px;margin:0 auto;border-radius:14px 14px 0 0;max-height:88%;overflow-y:auto;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px))}

.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:90;max-width:90%;text-align:center}

.app{max-width:1180px}

.abtns button{text-align:left;padding:7px 9px}.abtns small{display:block;color:var(--muted);font-size:12px;line-height:1.35}.abtns .tip{color:var(--ink);opacity:.8}

.elist{margin:4px 0 8px;padding-left:18px}

<script>
/* ===== 나락의 유산 B0 전투 프로토타입 — 엔진 (기획서 v2, 4.1~4.8 / 6.8 / 10.2) ===== */
'use strict';
const VERSION = '0.6a-dev';
const BHP = 22, BDMG = 2.3;            // 역할 기준값 B (4.6 역할 배율에 곱함) [B0 가설]
const r1 = v => Math.round(v * 10) / 10;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---- 역할 (4.6 역할별 기준 배율, B0 역할 6종 + 하수인) ---- */

/* ---- 빌드 3종 (10.2 B0) ---- */
/* 공용 스킬 풀: 어느 직업이든 3칸까지 자유롭게 */
const SKILL_SLOTS = 3;
/* 직업 전용 스킬 (시작부터, 그 직업만). type: melee | ranged | aoe | front(전열 전체) | self */
/* 직업 기술: 스킬 칸과 별도로 늘 쓸 수 있는 직업 고유 행동 */
function exclOf(build) { return (EXCL[build] || []).map(s => Object.assign({ excl: build, gen: 1, melee: s.type === 'melee' ? 1 : 0, ranged: s.type === 'ranged' ? 1 : 0, aoe: s.type === 'aoe' || s.type === 'front' ? 1 : 0, self: s.type === 'self' ? 1 : 0 }, s)); }
function skillMap(build) { const m = allSkills(); for (const s of exclOf(build)) m[s.id] = s; return m; }
function allSkillNames() { const m = allSkills(); for (const k in EXCL) for (const s of exclOf(k)) m[s.id] = s; return m; }
function isMeleeAct(p, id) { if ((p.build === 'hunter' || isCaster(p)) && (id === 'basic' || id === 'heavy')) return false; if (id === 'basic' || id === 'heavy') return true; const s = skillMap(p.build)[id]; return !!(s && s.melee); }
/* 데이터로 적은 스킬 하나를 처리한다 */
function genSkill(b, act, tgt) {
  const p = b.p; const fx = act.fx || {};
  payMana(b, act.mana);
  let cost = 0;
  if (act.hpCost) { cost = p.hpMax * act.hpCost * hpCostMul(p); p.hp -= cost; logp(b, 'bad', act.n + '의 값으로 생명력 ' + r1(cost)); if (p.hp <= 0) { checkEnd(b); return; } }
  let targets = act.type === 'aoe' ? alive(b).slice() : act.type === 'front' ? alive(b).filter(e => e.row === 'front') : act.type === 'self' ? [] : (tgt ? [tgt] : []);
  if (fx.harvest) { targets = targets.filter(e => e.s.weak || e.s.plague); if (!targets.length) logp(b, 'sys', '거둘 혼이 없다. 약화나 역병에 걸린 적이 없다'); }
  let spent = 0; if (fx.wardSpend) { spent = (p.ward || 0) * fx.wardSpend; p.ward = Math.max(0, (p.ward || 0) - spent); if (spent > 0) logp(b, 'good', '보호막 ' + r1(spent) + '을(를) 태운다'); else logp(b, 'sys', '태울 보호막이 없다'); }
  if (fx.brace) { p.brace = 1; logp(b, 'good', '살갗이 쇠처럼 굳는다. 다음 행동까지 받는 피해 −35%'); }
  let tot = 0; const scarUse = fx.scarAll ? p.scar : 0;
  for (const e of targets) {
    const many = act.type === 'aoe' || act.type === 'front' || act.aoe; const sn = n => many ? aoeN(n) : n; // 여럿에게 거는 상태이상은 절반
    if (fx.plague) addS(b, e, 'plague', sn(fx.plague)); // 저주로 쓰러뜨려도 역병이 옮도록 피해보다 먼저
    let base = act.dmg || 0;
    if (fx.poisonBonus && e.s.poison) base += e.s.poison.stacks;
    if (fx.weakDouble && e.s.weak) base *= 2;
    if (fx.scarAll) base = scarUse * fx.scarAll;
    if (fx.wardSpend) base += spent * fx.wardMul;
    if (fx.grudge) base += (p.tookLast || 0) * fx.grudge;
    if (fx.execute && e.hp <= e.hpMax * fx.execute) { base *= fx.execMul; logp(b, 'crit', e.n + '의 숨통을 끊으러 든다'); }
    if (fx.radiance && e.s.smite) { base *= 2; delete e.s.smite; }
    let dealt = 0;
    if (base > 0) dealt = hurtEnemy(b, e, outDmg(b, base, {}), { single: act.type === 'melee' || act.type === 'ranged' ? 1 : 0, aoe: act.aoe ? 1 : 0, melee: act.melee ? 1 : 0, fire: fx.ignite ? 1 : 0, label: act.n }); tot += dealt;
    if (fx.harvest && dealt > 0) { const hl = p.hpMax * fx.harvest * healMul(p); p.hp = Math.min(p.hpMax, p.hp + hl); smiteHeal(b, hl); }
    if (fx.transfuse && dealt > 0 && e.s.bond) { const hl = dealt * fx.transfuse * healMul(p); p.hp = Math.min(p.hpMax, p.hp + hl); logp(b, 'good', '이어진 피를 거두어 생명력 +' + r1(hl)); }
    if (!e.alive) continue;
    if (fx.poison) addPoison(b, e, sn(fx.poison), 1);
    if (fx.ignite) addS(b, e, 'ignite', sn(3));
    if (fx.chill) addS(b, e, 'chill', sn(2), fx.chill, 5);
    if (fx.weak) addS(b, e, 'weak', sn(2));
    if (fx.vuln) addS(b, e, 'vuln', sn(2));
    if (fx.brk) addBreak(b, e, fx.brk);
    if (fx.trap) { e.s.trap = { stacks: outDmg(b, fx.trap, {}), brk: fx.trapBrk || 0, until: b.t + 4, dur: 4 }; }
    if (fx.rift) { e.s.rift = { stacks: outDmg(b, fx.rift, {}), brk: fx.riftBrk || 0, until: b.t + 2, dur: 2 }; }
    if (fx.echo) { e.s.echo = { stacks: outDmg(b, act.dmg, {}), until: b.t + 1.5, dur: 1.5 }; }
    if (fx.bleed) addS(b, e, 'bleed', sn(fx.bleed));
    if (fx.smite) addS(b, e, 'smite', sn(fx.smite));
    if (fx.bond) addS(b, e, 'bond', sn(fx.bond));
  }
  if (fx.scarAll) { p.scar = 0; if (scarUse < 1) logp(b, 'sys', '태울 상흔이 없다'); }
  if (fx.allWeak) { for (const e of alive(b)) addS(b, e, 'weak', aoeN(2)); logp(b, 'good', '포효에 적들이 움츠러든다. 모두 약화'); }
  if (fx.rage) addRage(b, fx.rage);
  if (fx.ward) { p.ward = Math.min(40, (p.ward || 0) + fx.ward); logp(b, 'good', '보호막 ' + Math.round(p.ward)); }
  if (fx.protect) addS(b, p, 'protect', 3);
  if (fx.healPct) { const hl = p.hpMax * fx.healPct * healMul(p); p.hp = Math.min(p.hpMax, p.hp + hl); logp(b, 'good', act.n + '. 생명력 +' + r1(hl)); smiteHeal(b, hl); }
  if (fx.lifesteal && tot > 0) { p.hp = Math.min(p.hpMax, p.hp + tot * fx.lifesteal * healMul(p)); logp(b, 'good', '빼앗은 기운으로 생명력 +' + r1(tot * fx.lifesteal)); }
  if (fx.cleanseOne) { for (const k of ['poison', 'bleed', 'ignite', 'chill', 'weak', 'vuln', 'brand']) if (p.s[k]) { cleanse(b, [k], false); break; } }
  if (fx.cleanseAll) { const n = cleanse(b, ['poison', 'bleed', 'ignite', 'chill', 'weak', 'vuln', 'brand'], false); if (n && fx.wardPer) { p.ward = Math.min(40, (p.ward || 0) + n * fx.wardPer); logp(b, 'good', '속죄의 빛이 막이 된다. 보호막 ' + Math.round(p.ward)); } }
  if (fx.scarFromCost && cost > 0) { p.scar = Math.min(p.hpMax * 0.5, p.scar + cost * fx.scarFromCost); logp(b, 'good', '흘린 피가 상흔이 된다. 상흔 ' + Math.round(p.scar)); }
  if (fx.suture) { const hl = p.scar; p.scar = 0; p.hp = Math.min(p.hpMax, p.hp + hl); logp(b, 'good', '상흔을 꿰매 생명력 +' + r1(hl)); }
  p.lastSkillDmg = act.aoe ? tot / Math.max(1, targets.length) : tot;
  if (targets[0]) applyReflux(b, targets[0]);
}
function allSkills() { const m = {}; for (const k in BUILDS) for (const s of BUILDS[k].skills) m[s.id] = Object.assign({ home: k }, s); return m; }
function skillsOf(p) { return p.skills && p.skills.length ? p.skills : DEFAULT_SKILLS[p.build]; }
function scarRate(p) { const r = p.build === 'scar' ? 0.2 : (skillsOf(p).some(id => id === 'scarcut' || id === 'release') ? 0.10 : 0); return r > 0 && hasIt(p, 'scarcharm') ? Math.max(0.05, r - 0.05) : r; }
const REV_DMG = 8;
const PSN = { viper: 6, viperN: 3, cloudN: 3, brk: 4, swampN: 2 };
const POISON_FOREVER = 1e9; // 중독은 시간 제한이 아니라 수치로 끝난다
/* 중독 걸기: 1씩 오른다(상한 없음). n번 건다 = +n */
function addPoison(b, u, n, byMe) { if (u === b.p && u.eq && u.eq.amulet === 'sigil') u.mp = Math.min(u.mpMax, u.mp + 4); if (byMe && b.p.build === 'assassin') n += 1; const cur = u.s.poison; u.s.poison = { stacks: (cur ? cur.stacks : 0) + n, until: POISON_FOREVER, dur: POISON_FOREVER }; }
/* 남은 독 피해 총합: n + (n-1) + ... + 1 */
function poisonTotal(n) { return n * (n + 1) / 2; }

/* ---- 6.8 빌드를 바꾸는 아이템 (B0: 막힘 해결용 3 + 자발 시험용 3) ---- */
const hasIt = (p, k) => Object.values(p.eq || {}).includes(k);
function itemFits(p, k) {
  const sk = skillsOf(p);
  if (k === 'knot') return sk.some(id => ['burst', 'release', 'scarburst'].includes(id));
  if (k === 'scarcharm') return scarRate(p) > 0;
  if (k === 'vpouch') return p.build === 'assassin' || sk.some(id => ['viper', 'cloud', 'dagger', 'smoke', 'burst'].includes(id)) || hasIt(p, 'venomring');
  if (k === 'resostone') return sk.length >= 2;
  const SKM = skillMap(p.build);
  if (k === 'chaingl') return sk.some(id => SKM[id] && SKM[id].melee);
  if (k === 'bloodoil') return p.build === 'warlock' || hasIt(p, 'ledger') || sk.some(id => SKM[id] && SKM[id].hpCost);
  if (['hereticstaff', 'brokencenser', 'abysseye', 'singedgloves', 'conductor'].includes(k)) return sk.some(id => SKM[id] && SKM[id].aoe && (SKM[id].dmg || 0) > 0 || ['fireball', 'release'].includes(id));
  if (k === 'wardcrest') return p.build === 'templar' || p.build === 'arcanist' || sk.some(id => ['barrier', 'aura', 'atone'].includes(id));
  return true;
}

function classFit(p, k) { const ws = CLASS_FIT[p.build] || []; const a = (ITEMS[k] && ITEMS[k].act) || ''; return itemFits(p, k) && ws.some(w => a.includes(w)); }

/* ---- 방 구성 (10.2 방 표) ---- */

/* ---- 고정 상황 5개 (10.2 검증 질문 1) ---- */

/* ================= 상태 생성 ================= */
/* 능력치 (5.2절): 1점마다 눈에 보이는 규칙 하나 */
const STATN = { str: '힘', dex: '민첩', int: '지능' };
function stat(p, k) { return (p.stat && p.stat[k]) || 0; }
/* 장비 기본 수치 (기획서 11.5절). 화면에서 고른 장비로 applyGear가 채운다 */
const START_GEAR = { wpn: 8, hp: 10, st: 0, mp: 0, flask: 0.3 };
const CANTRIP = { arcanist: '마력 화살', warlock: '그림자 화살', priest: '빛줄기' };
const isCaster = p => !!CANTRIP[p.build];
const STAM_FLASK = 60; // 스태미나 플라스크 회복량 (11.6절 [가설])
/* ===== 아이템 효과 표 (IFX, 기획서 11.5절 1챕터 100종 가운데 0.6 새 79종) =====
   엔진의 정해진 지점이 낀 장비의 효과를 부른다. 효과가 실제로 무언가를 바꾸면 FXHIT[아이템]을 센다(자동 점검용).
   지점: out(주는 피해 배율) hit(대상별 배율) hitAdd(대상별 더하기) brk(붕괴 더하기) onHit(맞힌 뒤) dotOut(내가 건 지속 피해 배율)
         inMul(받는 피해 배율) onHurt(맞은 뒤) onParry(흘리기 성공) onKill onStart onCleanse onFlask block(디버프 막기) dur(내 상태 지속 조정)
         st(최대치 더하기 {hp,mp,st}) hpMul cost(행동 비용 더하기) regen(스태미나 자연 회복 더하기) heal(플라스크 회복 더하기 %p) */
const FXHIT = {};
/* 타락한 수도원장 수치. 사람처럼 판단하는 테스터(여섯 성향) 1,920판에서 첫 도전 승률 48%로 맞춘 값 (10월 2일, 만든 사람 요청 50% 안팎) */
const CLS_TUNE = { warlockKill: 0.15 }; // 직업 규칙 수치: 암흑술사가 약화·취약된 적을 쓰러뜨리면 회복하는 생명력 비율
/* 광역 규칙 (10월 2일): 후열은 광역 피해를 덜 받고, 방패병이 서 있으면 후열을 감싼다(방패벽). 여럿에게 거는 상태이상은 단일의 절반 */
const AOE = { back: 0.7, wall: 0.5, shieldSelf: 0.75, status: 0.5 };
const aoeN = n => Math.max(1, Math.round(n * AOE.status));
const wallUp = (b, e) => e.alive && e.row === 'back' && e.role !== 'boss' && !!hasShield(b, e.id);
const TELE = { heavy: 5 }; // 적 강타 = 평소 공격 × heavy (예고를 읽고 막는 판단의 무게)
const ENRAGE = { boss: 45, room: 40, step: 10 }; // 광폭화 시각(시간 단위)과 짙어지는 간격
const ABBOT = { cycle: 5, brand: 0.2, vowHeal: 0.01, vowTaken: 0.6, monkHeal: 0.025 };
function codexHit(b, id, key) { b.codex = b.codex || {}; b.codex[id + '.' + key] = 1; }
const fxHit = k => { FXHIT[k] = (FXHIT[k] || 0) + 1; };
const DEBUFFS = ['poison', 'bleed', 'ignite', 'chill', 'weak', 'vuln', 'brand'];
const nDebuff = e => DEBUFFS.concat(['broken']).filter(k => e.s[k]).length;
const isSpell = c => !!(c && c.spell);
const IFX = {
  rustsword: { brk: (b, p, e, c) => c.id === 'basic' ? 2 : 0 },
  pilgstaff: { out: (b, p, c) => (isSpell(c) || c.cantrip) ? 1.03 : 1 },
  huntbow: { hit: (b, p, e, o) => e.row === 'back' ? 1.05 : 1 },
  dullknife: { hitAdd: (b, p, e, o, c) => c.id === 'basic' && e.s.poison ? 1 : 0 },
  guardspear: { hit: (b, p, e, o, c) => c.id === 'basic' && alive(b).filter(x => x.row === 'front').length >= 2 ? 1.05 : 1 },
  sickle: { hitAdd: (b, p, e, o, c) => c.id === 'basic' && e.s.bleed ? 1 : 0 },
  candlestaff: { hit: (b, p, e, o, c) => isSpell(c) && e.s.ignite ? 1.05 : 1 },
  pilgclub: { brk: (b, p, e, c) => c.id === 'heavy' ? 3 : 0 },
  acolyterelic: { onCleanse: (b, p, n) => { const t = (b.cur && b.cur.tgt && b.en.find(e => e.id === b.cur.tgt && e.alive)) || alive(b).find(e => e.role !== 'root'); if (t && n > 0) { hurtEnemy(b, t, n, { label: '성구의 빛' }); return 1; } } },
  monkmace: { hit: (b, p, e) => e.s.broken ? 1.15 : 1 },
  confwand: { onCleanse: (b, p, n) => { if (n > 0) { p.fxSpell = 1.2; return 1; } }, out: (b, p, c) => { if (isSpell(c) && p.fxSpell) { const m = p.fxSpell; p.fxSpell = 0; return m; } return 1; } },
  sawaxe: { onHit: (b, p, e, o, c) => { if (c.id === 'heavy' && e.alive) { addS(b, e, 'bleed', 2); return 1; } } },
  penwhip: { hit: (b, p, e, o, c) => c.id === 'basic' && e.s.weak ? 1.15 : 1 },
  brandiron: { onHit: (b, p, e, o, c) => { if (c.id === 'heavy' && e.alive) { addS(b, e, 'ignite', 2); return 1; } } },
  gravespade: { onKill: (b, p) => { p.fxHeavyDisc = 15; return 1; }, cost: (p, id) => id === 'heavy' && p.fxHeavyDisc ? -p.fxHeavyDisc : 0 },
  bonedagger: { hit: (b, p, e, o, c) => c.id === 'heavy' && e.s.poison && e.s.poison.stacks >= 4 ? 1.2 : 1 },
  silverwand: { onKill: (b, p) => { if (b.cur && b.cur.skill) { p.mp = Math.min(p.mpMax, p.mp + 5); return 1; } } },
  twinblades: { cost: (p, id) => id === 'heavy' ? 10 : 0 },
  bloodblade: { onHit: (b, p, e, o, c, d) => { if (o.melee && d > 0) { p.hp = Math.min(p.hpMax, p.hp + d * 0.1); return 1; } }, healMul: 0.8 },
  quilted: { inMul: (b, p, o) => p.guard && !o.dot ? 0.95 : 1 },
  monkrobe: { st: { mp: 5 } },
  leathervest: { cost: (p, id) => id === 'dodge' ? -3 : 0 },
  novicetunic: { st: { st: 5 } },
  oldchain: { inMul: (b, p, o) => o.charged ? 0.95 : 1 },
  pilgcoat: { inMul: (b, p, o) => o.dot ? 0.95 : 1 },
  waxrobe: { dur: (k) => k === 'ignite' || k === 'bleed' ? -1 : 0 },
  guardplate: { st: { hp: 5 } },
  chainmail: { inMul: (b, p, o) => o.charged ? 0.9 : 1 },

/* ===== 캐릭터 만들기: 이름 → 직업 → 스킬 → 능력치 (끝까지 정하기 전에는 저장하지 않는다) ===== */
const CNAMES = ['아르덴', '베일', '카엘', '로웬', '세린', '이렌', '모르간', '하엘', '테오', '엘다', '미르', '오웬', '리안', '세라', '단테', '노아', '에반', '루카', '시엘', '하린', '바엘', '유리엘', '케인', '마렌'];
function vCreate() {

/* ===== 랭킹 (기획서 11.11절): 가장 멀리 간 캐릭터. 깬 챕터 → 층 → 레벨, 같으면 플레이 시간이 짧은 쪽 ===== */
const RANK_ST = { dead: '쓰러짐', clear: '돌파', abandon: '포기', alive: '진행 중' };
const rankScore = e => (e.clears || 0) * 1000 + ((e.ch || 1) > (e.clears || 0) ? (e.floor || 0) : 0);
const rankCmp = (a, b) => rankScore(b) - rankScore(a) || (b.lv || 1) - (a.lv || 1) || (a.ms || 0) - (b.ms || 0);
function rankProg(e) { return (e.clears || 0) >= (e.ch || 1) ? `${e.clears}챕터 돌파` : `${e.ch || 1}챕터 ${floorName(e.floor || 1)}`; }
function fmtMs(ms) { const m = Math.round((ms || 0) / 60000); return m < 60 ? m + '분' : Math.floor(m / 60) + '시간 ' + (m % 60) + '분'; }
/* 플레이 시간: 누르거나 키를 칠 때마다 지난 시간을 더한다. 한 번에 1분까지만 더해 자리를 비운 시간은 세지 않는다 */
function playTick() { const run = G.run; if (!run || run.endedAt || G.creating) return; const now = Date.now(); run.playMs = (run.playMs || 0) + Math.min(60000, Math.max(0, now - (run.tick || now))); run.tick = now; }
function rankEntry(run, st) {
  return { id: run.id, v: VERSION, cname: run.cname || '', build: run.build, ch: run.ch || 1, floor: Math.min(run.room || 1, FLOOR_BOSS), clears: run.clears || 0, lv: run.lv || 1, st: st || (run.clears ? 'clear' : 'alive'), ms: Math.round(run.playMs || 0), at: Date.now(), eq: run.eqU ? EQ_SLOTS.map(sl => { const it = run.eqU[sl] && run.inv[run.eqU[sl]]; return it ? it.tpl : null; }).filter(Boolean) : [] };
}
async function pushRank(run, st) {
  if (!run || !run.id) return; const e = rankEntry(run, st);
  G.data.rank6 = Object.assign({}, G.data.rank6, { [run.id]: e }); saveLocal();
  if (!G.db || !G.uid || G.conn !== 'ok') return;
  try {
    const ref = G.db.doc('board/' + G.uid); const cur = await ref.get();
    const d = cur.exists ? JSON.parse(JSON.stringify(cur.data() || {})) : {}; const R = d.rank6 = d.rank6 || {}; R[run.id] = e;
    Object.keys(R).sort((a, b) => rankCmp(R[a], R[b])).slice(40).forEach(id => delete R[id]); // 한 사람당 40개까지
    d.name = G.data.name || d.name || ''; await ref.set(d); G.board = null; if (G.scr === 'rank') render();
  } catch (e2) { }
}
function rankRows() {
  const out = [];
  if (G.db && G.board) { for (const x of G.board) for (const e of Object.values(x.rank6 || {})) out.push(Object.assign({ nick: x.name || '', me: x.uid === G.uid }, e)); }
  else for (const e of Object.values(G.data.rank6 || {})) out.push(Object.assign({ nick: G.data.name || '', me: true }, e));
  return out.filter(e => BUILDS[e.build]).sort(rankCmp);
}
function backBtn() { return `<button class="sm back" data-a="back">← 돌아가기</button>`; }
function vRank() {

  // 3) 전장

  };
  const bk = b.en.filter(e => e.alive && e.row === 'back'), fr = b.en.filter(e => e.alive && e.row === 'front');
  const field = `<section class="field" aria-label="전장">
    <div class="rowlab"><span>후열. 근접 공격은 전열이 비거나 무너져야 닿습니다</span></div><div class="enemies">${bk.map(ecard).join('') || '<p class="mini">없음</p>'}</div>
    <div class="rowlab"><span>전열</span></div><div class="enemies">${fr.map(ecard).join('') || '<p class="mini">없음</p>'}</div><div class="fhelp"><span class="mini">규칙 보기</span>${q('row', '전열·후열')}${q('intent', '예고')}${q('break', '붕괴')}${q('status', '상태이상')}${q('roles', '적의 역할')}</div></section>`;
  // 4) 행동판
  let dock;
  if (b.over) {
    const msg = b.over === 'win' ? '승리했습니다.' : b.over === 'lose' ? '쓰러졌습니다.' : b.over === 'flee' ? '물러났습니다. 이 방은 다시 이겨야 합니다.' : '이 상황은 여기까지입니다.';
    dock = `<section class="dock"><p><b>${msg}</b></p><button class="gold wide" data-a="${G.scr === 'scen' ? 'scennext' : 'bcont'}" data-focus>계속</button></section>`;
  } else {
    const L = actionList(b);
    let btns = '';
    let kn = 0;

      if (!list.length) continue;
      btns += `<div class="agp" role="group" aria-label="${esc(lab)}"><span class="agl" aria-hidden="true">${esc(lab)}</span>`;
      for (const a of list) {
        let why = '';
        if (!a.ok) why = a.why || (a.id === 'heavy' || a.id === 'guard' || a.id === 'dodge' ? '스태미나 부족' : a.skill ? '마나 부족' : '충전 없음');
        else if (tg && !a.self && !a.aoe && !canTarget(b, tg, a)) why = '이 대상에 닿지 않음';
        const dis = G.busy || !(a.ok && !why);
        const urgent = !dis && (a.id === 'flaskL') && p.hp < p.hpMax * 0.35;
        const at = !dis ? actTarget(b, a) : null; const gd = at && isMeleeAct(p, a.id) ? guardOf(b, at) : null;
        kn++;
        btns += `<button class="ab g-${lab === '공격' ? 'atk' : lab === '스킬' ? 'sk' : lab === '지키기' ? 'def' : lab === '직업' ? 'sig' : 'etc'}${dis ? ' dis' : ''}${urgent ? ' urgent' : ''}" data-a="act" data-id="${a.id}" data-info="act:${a.id}" data-k="${kn}" aria-disabled="${dis}"><b>${kn <= 9 ? `<kbd>${kn}</kbd>` : ''}${esc(a.n)}</b><small>${why ? esc(why) : esc(a.cost) + ' · ' + esc(skillHint(b, a) || speedWord(a.time)) + (at ? ' → ' + esc(at.n) + (gd ? ' 🛡' : '') : a.aoe ? ' → 전체' : '')}</small></button>`;
      }

      <div class="abgrid">${btns}</div></section>`;
  }
  const groups = []; for (const x of b.log) { const g = x.g || 0; if (!groups.length || groups[groups.length - 1].g !== g) groups.push({ g, items: [] }); groups[groups.length - 1].items.push(x); }
  const glog = groups.slice(-14).reverse().map((G2, gi) => `<div class="lgrp${gi === 0 ? ' now' : ''}"><div class="lgh">${G2.g ? G2.g + '번째 차례' : '전투 시작'}</div>${G2.items.map(x => `<p class="${x.c}">${esc(x.m)}</p>`).join('')}</div>`).join('');
  const side = `<aside class="side${G.logOpen ? ' open' : ''}" aria-label="전투 기록"><div class="sidehead"><h4>전투 기록</h4><button class="sm onlym" data-a="logclose">닫기</button></div><div class="blog" role="log">${glog}</div><div class="mini">맨 위가 가장 최근 차례입니다. 한 차례 안에서는 위에서 아래로 읽습니다.</div></aside>`;
  return `<div class="bgrid"><div class="btop">${status}<div class="bmid">${vOrder(b)}${gim}<div class="logrow">${lastl}<button class="sm onlym" data-a="logopen">기록</button></div></div></div>${field}${dock}${side}</div>`;
}

/* 설명 줄: 가리키거나 포커스하면 갱신 (재렌더 없이) */
function onTip(ev) {
  const el = ev.target.closest && ev.target.closest('[data-tip]'); if (!el || !G.b) return;
  const d = document.getElementById('adesc'); if (d) d.textContent = actDesc(G.b, el.dataset.tip);
}

/* ===== 표시 규칙: T 숨기기, 순서·빠르기·남은 차례 + 설명 창 ===== */
/* 빌드 자원: 항상 보이게 */
function buildRes(p) {
  if (p.build === 'berserker') { const rt = p.s && p.s.rage ? '<b class="rg">격노</b>' : `<span class="pips" aria-label="분노 ${p.rage}/10">${'●'.repeat(p.rage)}${'○'.repeat(Math.max(0, 10 - p.rage))}</span>`; return `<div class="bres"><span class="rgw" data-info="rage" tabindex="0">분노 ${rt}</span></div>`; }
  if (!(scarRate(p) > 0)) return '';
  const mx = Math.round(p.hpMax * 0.5), w = mx ? Math.min(100, p.scar / mx * 100) : 0;
  const rageTxt = p.s && p.s.rage ? '<b class="rg">격노</b>' : `<span class="pips" aria-label="분노 ${p.rage}/10">${'●'.repeat(p.rage)}${'○'.repeat(Math.max(0, 10 - p.rage))}</span>`;
  return `<div class="bres"><div class="mb" data-info="scar" tabindex="0"><div class="bar sc" role="progressbar" aria-label="상흔" aria-valuemin="0" aria-valuemax="${mx}" aria-valuenow="${Math.round(p.scar)}"><i style="width:${w}%"></i><span>상흔 ${Math.round(p.scar)}/${mx}</span></div></div></div>`;
}
function dmgMult(p) { let m = 1; if (p.eq.ring1 === 'pulse' || p.eq.ring2 === 'pulse') m *= 1.35; if (p.s.weak) m *= 0.75; if (p.s.rage) m *= 1.4; if (p.build === 'berserker' && p.rage) m *= 1 + p.rage * 0.03; return m; }
/* 지금 쓰면 나올 값 */
function skillHint(b, a) {
  const p = b.p; const tg = G.sel ? b.en.find(e => e.id === G.sel && e.alive) : null;
  if (a.id === 'release') return p.scar < 1 ? '상흔 없음' : `상흔 ${Math.round(p.scar)} → 적마다 ${r1(p.scar * 0.8 * dmgMult(p))}`;
  if (a.id === 'scarcut') return p.scar < 1 ? '상흔 없음' : `상흔 추가 ${r1(p.scar * 0.5 * 1.5 * dmgMult(p))}`;
  if (a.id === 'purge') { let n = 0; for (const k of ['poison', 'bleed', 'ignite', 'chill', 'weak', 'vuln', 'brand']) if (p.s[k]) n += (k === 'poison' || k === 'chill') ? p.s[k].stacks : 1; return n ? `해제 ${n} → ${r1(n * 5 * dotMul(p) * dmgMult(p))}` : '해제할 것 없음'; }
  if (a.id === 'burst') { const t = actTarget(b, a); const n = t && t.s.poison ? t.s.poison.stacks : 0; return n ? `중독 ${n} → ${r1(poisonTotal(n) * dotMul(p) * 1 * dmgMult(p))}·붕괴+${n * PSN.brk}` : '중독된 적 없음'; }
  return '';
}
function rootRegen(b) {
  const boss = alive(b).find(e => e.boss === 'tree'); if (!boss) return 0;
  const roots = alive(b).filter(e => e.role === 'root').length;
  return Math.round(boss.hpMax * 0.025 * roots / 3 * (b.season === 0 ? 2 : 1) / pSpeed(b) * 10) / 10;
}
function autoTarget(b, a) {
  const p = b.p;
  if (a.id === 'dodge') return pickDodge(b);
  let c = alive(b).filter(e => canTarget(b, e, a));
  if (a.id === 'reverse') c = c.filter(e => e.role !== 'root');
  if (!c.length) return null;
  const nonRoot = c.filter(e => e.role !== 'root'); const bossAlive = c.find(e => e.role === 'boss');
  if (a.id === 'burst') { const ex = c.filter(e => e.s.poison).sort((x, y) => y.s.poison.stacks - x.s.poison.stacks)[0]; if (ex) return ex; }
  if (a.id === 'viper') { const pool = (nonRoot.length ? nonRoot : c).filter(e => !e.s.poison || e.s.poison.stacks < 10); if (pool.length) return pool.sort((x, y) => ((y.s.poison ? y.s.poison.stacks : 0) - (x.s.poison ? x.s.poison.stacks : 0)) || (x.hp - y.hp))[0]; }
  if (a.id === 'reverse') return c.sort((x, y) => y.dmg - x.dmg)[0];
  const pool = nonRoot.length ? nonRoot : c;
  return pool.sort((x, y) => x.hp - y.hp)[0];
}
function explodeTarget(b) {
  const sel = G.sel ? b.en.find(e => e.id === G.sel && e.alive) : null;
  const ok = e => e && e.s.poison && e.s.poison.stacks >= 5 && canTarget(b, e, { id: 'basic', melee: 1 });
  if (ok(sel)) return sel;
  return alive(b).filter(ok).sort((x, y) => y.s.poison.stacks - x.s.poison.stacks)[0] || null;
}
function speedWord(t) { return t <= 0.6 ? '빠름' : t <= 1.05 ? '보통' : '느림'; }
/* 지금부터 until 시점 전까지 내 차례가 몇 번 오는가 (기본 행동 기준) */
function myTurnsUntil(b, until) {
  const s = pSpeed(b); const start = Math.max(b.pNext, b.t);
  if (until <= start + 1e-9) return 0;
  return Math.ceil((until - start) * s - 1e-9);
}
/* 이 행동을 하면 내 다음 차례 전에 누가 몇 번 움직이는가 */
function previewAfter(b, time) {
  const myNext = b.t + time / pSpeed(b);
  const out = [];
  for (const e of alive(b)) {
    if (e.role === 'root') continue;
    const sp = eSpeed(b, e); let n = 0; let at = e.next;
    while (at < myNext - 1e-9 && n < 5) { n++; at += 1 / sp; }
    if (n) out.push({ e, n });
  }
  return out;
}
function previewText(b, time) {
  const L = previewAfter(b, time);
  if (!L.length) return '내 다음 차례 전에 움직이는 적이 없습니다.';
  const g = {};
  for (const x of L) { const k = x.e.n; g[k] = g[k] || { n: 0, times: [] }; g[k].n++; g[k].times.push(x.n); }
  const parts = Object.entries(g).map(([name, v]) => {
    const same = v.times.every(t => t === v.times[0]);
    const tt = same ? (v.times[0] > 1 ? ' ' + v.times[0] + '번씩' : '') : ' (' + v.times.join('·') + '번)';
    return (v.n > 1 ? name + ' ' + v.n + '기' : name) + tt;
  });
  let s = '내 다음 차례 전에 ' + parts.join(', ') + ' 움직입니다.';
  const warn = [];
  for (const x of L) {
    const k = x.e.intent && x.e.intent.k;
    if (k === 'heavy') warn.push(x.e.n + '의 강타');
    else if (k === 'charge' && x.n >= 2) warn.push(x.e.n + '의 강타(충전 후 이어서)');
    else if (k === 'explode') warn.push(x.e.n + '의 폭발');
    else if (k === 'fuse' && x.n >= 2) warn.push(x.e.n + '의 폭발(준비 후 이어서)');
    else if (k === 'heal') warn.push(x.e.n + '의 치유');
    else if (k === 'mirror') warn.push('나락의 거울');
  }
  if (warn.length) s += ' 그 사이 ' + Array.from(new Set(warn)).join(', ') + '이(가) 나옵니다.';
  return s;
}
function leftTurns(b, x) { const n = myTurnsUntil(b, x.until); return n; }

/* 상태 표시: 숫자 = 끝날 때까지 남은 내 차례 수, 가는 막대 = 남은 비율 */
function stsHtml(u, b) {
  const out = [];
  const who = u === b.p ? 'p' : u.id;
  for (const k in u.s) {
    const x = u.s[k]; const n = leftTurns(b, x);
    const dur = x.dur || Math.max(1, x.until - (x.from != null ? x.from : b.t));
    const frac = Math.max(0, Math.min(1, (x.until - b.t) / dur));
    out.push(`<i class="${BUFFS[k] ? 'b' : 'd'}" data-info="st:${who}:${k}" tabindex="0">${SNAMES[k] || k}${k === 'poison' ? ' <span class="pv2">' + x.stacks + '</span>' : (x.stacks > 1 ? ' ×' + x.stacks : '')} ${k === 'poison' || k === 'brand' ? '' : '<b>' + (n > 0 ? n : '곧') + '</b>'}${k === 'poison' || k === 'brand' ? '' : `<u style="width:${frac * 100}%"></u>`}</i>`);
  }
  if (u.stun > 0) out.push(`<i class="d" data-info="stun" tabindex="0">기절</i>`);
  if (u === b.p) {
    if (u.guard) out.push('<i class="b" data-info="guardon" tabindex="0">막는 중</i>');
    if (u.dodge) { const de = b.en.find(x => x.id === u.dodge); out.push(`<i class="b" data-info="dodgeon" tabindex="0">${esc(de ? de.n : '')} 흘리기</i>`); }
    if (u.exhaust) out.push('<i class="d" data-info="exhaust" tabindex="0">탈진</i>');
    if (u.ward > 0) out.push(`<i class="b" data-info="ward" tabindex="0">보호막 <b>${Math.round(u.ward)}</b></i>`);
    if (u.counter > 0) out.push(`<i class="b" data-info="counter" tabindex="0">반격 +${r1(u.counter)}</i>`);
    if (u.reflux) out.push('<i class="b" data-info="reflux" tabindex="0">되돌릴 독</i>');
  }
  return out.length ? `<div class="sts">${out.join('')}</div>` : '';
}

/* 순서표 (숫자 없이) */
function vOrder(b) {
  const tl = preview(b);
  return `<div class="order"><div class="axhead"><span><b>행동 순서</b></span><span class="axdef">왼쪽이 먼저 움직입니다</span>${q('time', '차례와 시간')}</div>
  <ol class="ord">${tl.map((x, i) => { const e = b.en.find(y => y.n === x.n && y.alive); const ico = x.me ? '' : (e ? e.ico + ' ' : ''); return `<li class="${x.me ? 'me' : ''}" data-info="tl:${i}" tabindex="0">${ico}${esc(x.me ? '나' : x.n)}</li>`; }).join('')}</ol></div>`;
}

/* ---------- 설명 창 동작 (올리면 뜨고, 휴대폰은 길게 누르기) ---------- */
const POP = { el: null, t: 0, touchT: 0, suppress: false, cur: null };
function popEl() { if (!POP.el) { POP.el = document.createElement('div'); POP.el.id = 'pop'; POP.el.className = 'pop'; POP.el.setAttribute('role', 'tooltip'); document.body.appendChild(POP.el); } return POP.el; }
function showPop(target) {
  if (!G.infoOn) return;
  const key = target.dataset.info; const html = infoHtml(key); if (!html) return hidePop();
  const el = popEl(); el.innerHTML = html; el.style.display = 'block'; POP.cur = target;
  const r = target.getBoundingClientRect(); const pw = Math.min(320, window.innerWidth - 16);
  el.style.width = pw + 'px';
  const ph = el.offsetHeight;
  let left = Math.min(Math.max(8, r.left + r.width / 2 - pw / 2), window.innerWidth - pw - 8);
  let top = r.top - ph - 8; if (top < 8) top = Math.min(window.innerHeight - ph - 8, r.bottom + 8);
  el.style.left = left + 'px'; el.style.top = top + 'px';
}
function hidePop() { clearTimeout(POP.t); if (POP.el) POP.el.style.display = 'none'; POP.cur = null; }
function initPop() {
  document.addEventListener('pointerover', ev => {
    if (ev.pointerType === 'touch') return;
    const t = ev.target.closest && ev.target.closest('[data-info]'); if (!t) return;
    clearTimeout(POP.t); POP.t = setTimeout(() => showPop(t), 180);
  });
  document.addEventListener('pointerout', ev => {
    if (ev.pointerType === 'touch') return;
    const t = ev.target.closest && ev.target.closest('[data-info]'); if (!t) return;
    const to = ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest('[data-info]');
    if (to === t) return; hidePop();
  });
  document.addEventListener('focusin', ev => { const t = ev.target.closest && ev.target.closest('[data-info]'); if (t && ev.target.matches(':focus-visible')) showPop(t); });
  document.addEventListener('focusout', () => hidePop());
  document.addEventListener('pointerdown', ev => {
    if (ev.pointerType !== 'touch') { return; }
    const t = ev.target.closest && ev.target.closest('[data-info]'); hidePop(); if (!t) return;
    POP.suppress = false; clearTimeout(POP.touchT);
    POP.touchT = setTimeout(() => { POP.suppress = true; showPop(t); }, 450);
  });
  const cancel = () => clearTimeout(POP.touchT);
  document.addEventListener('pointerup', cancel); document.addEventListener('pointercancel', cancel);
  document.addEventListener('click', ev => { if (POP.suppress) { POP.suppress = false; ev.stopPropagation(); ev.preventDefault(); } }, true);
  document.addEventListener('contextmenu', ev => { if (ev.target.closest && ev.target.closest('[data-info]')) ev.preventDefault(); });
  window.addEventListener('scroll', hidePop, true);
}

async function readCode(code) {
  code = String(code || '').replace(/\s+/g, '');

async function importCode(code) {
  const d = await readCode(code);
  let hsh = 0; for (const ch of code) hsh = (hsh * 31 + ch.charCodeAt(0)) | 0;
  const id = 'imp_' + (d.name ? d.name.replace(/[^\w가-힣]/g, '').slice(0, 12) + '_' : '') + Math.abs(hsh).toString(36);
  await G.db.doc('playtest/' + id).set({ v: d.v, updatedAt: d.at || Date.now(), runs: (d.runs || []).length, name: d.name || '', imported: true });
  for (const r of d.runs || []) await G.db.doc('playtest/' + id + '/' + COL.runs + '/' + r.id).set(r);
  for (const s of d.scen || []) if (s && s.id) await G.db.doc('playtest/' + id + '/' + COL.scen + '/' + s.id).set(s);
  if (d.final) await G.db.doc('playtest/' + id + '/' + COL.survey + '/final').set(d.final);

}

function sbDb(sb, uid) {
  const own = path => path === 'playtest/' + uid || path.startsWith('playtest/' + uid + '/') || path === 'board/' + uid;
  return {
    doc: path => ({
      get: async () => { const { data, error } = await sb.from('docs').select('id,data').eq('path', path).maybeSingle(); if (error) throw Object.assign(new Error(error.message), { code: error.code }); return { exists: !!data, id: data && data.id, data: () => data ? clone(data.data) : undefined }; },

function memDb(rows) {

    collection: path => ({ get: async () => ({ docs: rows.filter(r => parent(r.path) === path).map(r => ({ id: idOf(r.path), data: () => clone(r.data) })) }) }),

const PACE = { step: -1, slow: 1600, normal: 1000, fast: 450, instant: 0 };
const PACEN = { step: '한 단계씩', slow: '느리게', normal: '보통', fast: '빠르게', instant: '즉시' };
const sleep = ms => new Promise(r => setTimeout(r, ms));
function waitStep() { return new Promise(r => { G.stepResolve = r; render(); }); }
function actTarget(b, a) {
  if (a.self || a.aoe) return null;
  const sel = G.sel ? b.en.find(e => e.id === G.sel && e.alive) : null;
  if (sel && canTarget(b, sel, a) && !(a.id === 'dodge' && sel.role === 'root')) return sel;
  return autoTarget(b, a);
}
function doAct(id, tid) {
  const b = G.b; if (!b || b.over || G.busy) return;
  const acts = actionList(b); const a = acts.find(x => x.id === id);
  if (!a || !a.ok) return;
  const t = tid ? b.en.find(e => e.id === tid && e.alive) : actTarget(b, a);
  commitAct(id, t ? t.id : null);
  playerAct(b, id, t ? t.id : null);
  if (G.sel && !(b.en.find(e => e.id === G.sel) || {}).alive) G.sel = null;
  const last = b.log[b.log.length - 1]; G.liveMsg = last ? last.m : '';
  if (b.waiting) animate(b); else afterTurn(b);
}
function afterTurn(b) {

  if (!G.data.seenBreak && b.rec.some(x => x.k === 'break')) { G.data.seenBreak = true; saveLocal(); setTimeout(() => openSheet('help', { k: 'break', first: 1 }), 50); }
  if (G.scr === 'scen') { b.pActs = (b.pActs || 0) + 1; if (b.pActs >= 10 && !b.over) b.over = 'open'; }
  render();
}
/* 다음에 움직일 적 */
function nextActor(b) {
  const al = alive(b).filter(e => e.role !== 'root'); let n = null;

  return n && n.next < b.pNext ? n : null;
}
/* 적이 한 명씩: 먼저 "누가 무엇을 한다"를 알리고, 그다음 결과를 보여준다 */
async function animate(b) {
  G.busy = true; G.skip = false; hidePop();
  const pace = () => G.skip ? 0 : PACE[G.pace || 'normal'];
  const wait = async (f) => { const v = pace(); if (v < 0) await waitStep(); else if (v) await sleep(v * f); };
  G.banner = null; render(); if (pace() > 0) await wait(0.5);
  while (b.waiting && G.b === b) {
    const nx = nextActor(b);
    if (nx) {
      G.banner = { who: nx.n, ico: nx.ico, what: nx.stun > 0 ? '비틀거려 행동을 놓친다' : intentText(b, nx).t, id: nx.id, phase: 'pre' };
      b.lastActor = nx.id; render(); await wait(0.55);

}

async function readTester(id) {
  const [rs, ss, fs, ms, bs] = await Promise.all([G.db.collection('playtest/' + id + '/' + COL.runs).get(), G.db.collection('playtest/' + id + '/' + COL.scen).get(), G.db.doc('playtest/' + id + '/' + COL.survey + '/final').get(), G.db.doc('playtest/' + id).get(), G.db.doc('board/' + id).get().catch(() => ({ exists: false }))]);
  const runs = [];
  for (const d of rs.docs) {
    const r = Object.assign({}, d.data());
    if (!r.acts && r.chunks) {
      const cs = await G.db.collection('playtest/' + id + '/' + COL.runs + '/' + d.id + '/acts').get();
      r.acts = cs.docs.map(x => x.data()).sort((x, y) => x.i - y.i).reduce((acc, x) => acc.concat(x.a || []), []);
    }
    runs.push(r);
  }
  const meta = ms.exists ? ms.data() || {} : {};
  return { uid: id, name: meta.name || (bs.exists ? (bs.data() || {}).name : '') || '', login: meta.login || '', runs, scen: ss.docs.map(x => x.data()), final: fs.exists ? fs.data() : null };
}
/* 결과 보기의 테스터 이름: 로그인한 사람은 닉네임과 로그인 방식, 아니면 기록판 이름에 (익명), 둘 다 없으면 순번 */

async function loadDash() {

      const live = G.db; G.db = memDb(rows || []);

}
