 .logrow{margin-top:4px}.logrow .lastlog,.logrow .turnban{font-size:calc(12.5px*var(--fs,1));padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;min-height:0}

/* ===== 10월 7일 접근성 · 가독성 (docs/조사/D-UI-접근성.md 고친 기록) ===== */

.bar.hp.lo{border-color:var(--bad)}.bar.hp.lo i{background:#a8362b}.bar .dz{color:#ffd9d2;font-weight:800}

.en .bar,.en .emv{display:block}

.sts .sgn{font-size:.78em;margin-right:2px;vertical-align:.05em}
/* 장비 칸 등급 글자 */
.eqg{display:inline-block;font-size:calc(11px*var(--fs,1));font-weight:700;border:1px solid currentColor;border-radius:3px;padding:0 3px;margin-right:5px;line-height:1.35;vertical-align:1px}

.sheet .shead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.sheet .shead h3{margin:0;flex:1;min-width:0}

.fit>.bmain{flex:1;min-height:0;display:flex;flex-direction:column}.sidehead h3{font-size:calc(15px*var(--fs,1))}
/* 전투 화면 맨 앞의 건너뛰기(초점을 받을 때만 보임), 헤더 소리 버튼 */
.skip{position:absolute;left:8px;top:-80px;z-index:100;min-height:40px;background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}.skip:focus{top:8px}.hardtag{margin-left:8px;border-color:var(--bad);color:var(--bad);font-weight:700}.tlog{margin:6px 0 0;padding-left:18px}.tlog li{margin:0 0 6px;white-space:pre-line}#main:focus{outline:none}

}

/* ===== 10월 7일 2차 (docs/조사/D-UI-접근성.md 고친 기록 2) ===== */
/* 짧은 창: 창 높이에 맞춘 고정 배치로는 전장이 모자라면 고정을 풀고 페이지를 스크롤한다(fitDecide) */

/* 내 상태의 자세한 정보(능력치 · 속도 · 장비 · 직업 규칙 · 예상 피해의 뜻)는 숨기지 않고 접는다 */
button.fdtog{flex:none;min-height:30px;padding:1px 8px;font-size:calc(12.5px*var(--fs,1));margin-left:4px;line-height:1.2}

.bar span{z-index:1}.bkline small{font-size:calc(12px*var(--fs,1))}

.fstat .pvt{display:inline-block;font-size:calc(12px*var(--fs,1));font-weight:700;margin-left:6px;color:var(--good)}
/* 쓰러짐 화면의 결정타 */
.killb{border-left:3px solid var(--blood);padding:6px 10px;background:var(--panel2);border-radius:6px;margin:8px 0}.killb b.kd{font-size:calc(18px*var(--fs,1));color:var(--bad)}
.lasthits{margin:4px 0 0;padding-left:18px}.lasthits li{margin:2px 0}
/* 쓸 수 없는 버튼(초점은 간다): 상점 · 다시 나누기 */
button.adis{cursor:not-allowed;color:var(--muted);background:var(--panel);border-style:dashed}
/* 갈래길 · 문 */
.dr-nums{font-size:calc(13px*var(--fs,1));margin:2px 0 0;font-variant-numeric:tabular-nums}.dr-nums b{color:var(--ink)}.dr-w{font-size:calc(12px*var(--fs,1));color:var(--muted);margin:0}
.dr-risk .rw{font-size:calc(12px*var(--fs,1));letter-spacing:0;margin-left:4px;font-weight:700}
/* 상점 비교 */
.sitem .cmp{margin:0}.sitem .cmph{font-size:calc(12.5px*var(--fs,1))}
/* 움직임 줄이기 (설정, OS 설정과 같은 결과) */

    '시험판에서는 암살자, 파수꾼, 사냥꾼, 원소술사, 마검사, 수도승을 고를 수 있습니다. 나머지 직업은 만드는 대로 열립니다. 메뉴의 🧪 시험 전투에서는 던전 없이 직업 · 레벨 · 스킬 · 적을 골라 바로 싸워 볼 수 있습니다.',
    '암살자는 근접 직업입니다. 흘리기가 피해를 70% 줄이고 스태미나 25만 듭니다(다른 직업은 60% · 30). 스킬로 적에게 중독을 쌓고, 터뜨리는 스킬로 쌓인 중독을 한꺼번에 피해로 바꿉니다. 중독은 라운드가 끝날 때마다 숫자만큼 피해를 주고 1 줄어듭니다. 몸을 낮춘 적에게 터뜨리면 피하고, 중독은 그대로 남습니다.',
    '파수꾼은 방어할 때마다 보호막 6을 얻습니다. 보호막은 최대 생명력의 30%까지 쌓여 받는 피해를 먼저 받아냅니다. 후열 적의 공격은 보호막이 절반만 받아냅니다. 성벽 갈래는 쌓은 보호막을 태워 칩니다.',
    '사냥꾼은 원거리라 기본 공격과 대부분의 스킬이 후열에 닿고, 전투를 시작하면 가속 1을 얻습니다. 가속이 있으면 라운드 맨 앞에서 두 번 연달아 움직입니다(한 라운드에 한 번, 두 번째 차례는 쿨타임이 줄지 않음). 같은 적을 연달아 맞히면 추적이 한 겹씩 쌓여(최대 3) 겹마다 피해 +5%(정예 · 강적 · 보스에게는 +10%)이고, 3겹인 적에게는 몸 낮추기와 버티기가 통하지 않습니다. 가속은 기동 갈래 스킬로 얻습니다. 방금 쓴 스킬과 다른 갈래의 스킬을 쓰면 연계가 되어 피해가 오릅니다(버튼의 🔗). 사냥꾼은 한 갈래를 깊이 파기보다 갈래를 바꿔 이어 쓸 때 제 힘을 냅니다. 스킬 한 번은 연타라도 한 겹이고, 추적을 더하는 효과로는 2겹까지만 오릅니다. 여럿을 치는 공격과 지속 피해는 추적에 손대지 않습니다.',
    '사냥꾼의 몸 빼기(기동 갈래)와 피하기 스킬은 다음에 맞는 공격 하나를 피합니다. 암살자의 시작 스킬 몸 빼기는 피하지 않고 보호와 스태미나를 줍니다. 적이 나를 직접 치는 공격(공격 · 겨눈 한 발 · 강타 · 큰 한 방)만 피할 수 있고, 화형 같은 주문, 지속 피해, 방 특성 피해는 피할 수 없습니다. 피했을 때 나가는 반격도 실제로 피했을 때만 나갑니다.',
    '원소술사는 원거리라 마력 화살과 집중 주문이 후열에 닿고, 대신 무기 피해의 ' + Math.round(BUILDS.elementalist.wpnMul * 100) + '%입니다. 한 적에게 화상과 둔화가 함께 있으면 그 행동이 끝날 때 열충격이 일어납니다. 열충격은 두 상태를 모두 지우고 (화상 + 둔화 × ' + ELEM.Cw + ') × ' + ELEM.D + '의 피해와 둔화 × ' + ELEM.Bk + '의 붕괴를 줍니다. 몸 낮추기를 지나가고, 버티기 같은 피해 감소는 절반만 받습니다. 지능이 열충격 피해를 올립니다.',
    '열충격은 행동이 끝난 뒤에 일어납니다. 한 행동 안의 여러 번 쏘기는 모두 먼저 맞습니다. 여럿을 치는 스킬로 일으킨 열충격은 광역 공격처럼 후열 · 방패벽에서 줄어듭니다. 적의 차례에 두 원소가 만나도(서리 갑옷 · 불꽃 외투) 그 행동 끝에 열충격이 일어납니다.',
    '서리 무게: 둔화된 적이 원소술사를 치는 평소 공격은 피해가 ' + Math.round(ELEM.guard * 100) + '% 줄어듭니다(적 카드의 ❄️무뎌짐). 강타 · 겨눈 한 발 · 화형 · 큰 한 방은 줄지 않습니다. 둔화로 라운드 맨 뒤에 선 적은 둔화가 다 줄어도 그 라운드의 공격이 무뎌집니다. 열충격으로 둔화를 깨뜨리면 무뎌짐도 사라집니다.',
    '마검사는 베기(⚔ 기본 공격 · 강공격 · 베기 스킬)와 주문(✦ 주문 스킬)을 번갈아 쓰면 교대가 되어, 그 행동이 끝난 뒤 보호막 +4를 얻습니다(내 차례마다 한 번, 최대 생명력의 15%까지). 방어 · 흘리기 · 플라스크는 순서를 끊지 않습니다. 교대가 두 번 이어지면 켜지는 스킬(⇄⇄)이 있고, 쓰면 이어진 교대는 0이 됩니다.',
    '마검사의 몇몇 주문은 칼에 출혈이나 화상을 싣습니다. 다음 베기의 첫 타격이 고른 적에게 피해를 주면 그 적에게 겁니다. 빗나가거나 그 타격에 적이 쓰러지면 칼에 남습니다. 주문 스킬은 후열에 닿습니다.',
    '수도승의 되받기: 방어하거나 자세를 잡은 동안 전열 적이 나를 직접 치면 그 적에게 되받아칩니다. 피해는 무기 피해의 ' + Math.round(MONK.ctr * 100) + '%이고 붕괴 +' + MONK.ctrBrk + '입니다. 강타를 되받으면 붕괴 +' + MONK.ctrBig + '를 더합니다. 내 차례와 다음 차례 사이에 ' + MONK.ctrMax + '번까지입니다. 자세를 겹쳐 잡아도 늘지 않습니다. 화형 · 광역 · 지속 피해, 방어로 줄지 않는 공격, 후열 적의 공격은 되받지 못합니다. 되받기는 내 행동이 아니라 기를 쓰지 않습니다.',
    '수도승의 기: 수도승의 강화입니다. 되받을 때, 차례의 첫 ⚡ 공격을 맞힐 때 1씩 모입니다(상한 5). ▶ 공격 한 번이 1을 써서 피해 +25%입니다. ⚡ 공격에는 실리지 않습니다. 약화와는 서로 깎습니다. 이번 행동으로 얻은 기는 다음 행동부터 듭니다.',
    '수도승의 자세: 수도승 스킬이 잡는 방어입니다. ▶ 자세는 방어와 같고(받는 피해 절반) 스태미나가 들지 않습니다. ⚡ 자세는 받는 피해를 줄이지 않고 되받기만 합니다. 내 다음 차례까지 이어집니다. 적 카드의 🥋↩는 내 다음 차례 전에 나를 직접 쳐서 되받을 수 있는 적입니다.',
    '직업마다 시작 스킬 둘이 늘 끼워져 있습니다. 장착 칸을 차지하지 않습니다.',
    '스킬 트리는 세 갈래이고, 갈래마다 두 칸씩 10줄의 사다리입니다(하급 6줄 → 중급 4줄). 윗줄 두 칸 가운데 하나만 열어도 아랫줄이 열립니다. 처음에는 모두 잠겨 있고, 캐릭터를 만들 때 포인트 1로 첫 줄의 한 칸을 엽니다. 레벨이 오를 때마다 포인트 1을 얻어 Lv10에 10점이 됩니다. 한 갈래를 줄마다 하나씩 내려가면 Lv6에 하급 끝, Lv10에 중급 끝입니다. 상급·궁극은 3챕터부터 더합니다. 챕터 사이 상점에서 트리 초기화를 사면 연 칸을 모두 닫고 포인트를 돌려받습니다(연 칸 하나에 ' + TREE_RESET.cell + '골드, 챕터마다 1.5배).',
    '윗줄을 열기 전에는 아랫줄 칸이 "?"로 보입니다. 갈래마다 강한 상황과 약한 상황이 있습니다(트리 갈래 설명).',
    '연 스킬 가운데 4칸을 끼웁니다. 메뉴의 "스킬 트리"에서 언제든 보고, 방과 방 사이에 열고 바꿉니다. 전투 중에는 보기만 합니다.',
    '스킬은 마나 대신 쿨타임으로 씁니다. 전투를 시작할 때 모두 사용 가능하고, 쓰면 적힌 턴만큼 기다립니다(예: 쿨타임 5턴). 턴은 내 차례 한 번입니다. 버튼에 "쿨타임 2턴 남음" 또는 "사용 가능"이 보입니다.',
    '🔄가 붙은 스킬은 같은 갈래의 다른 스킬 쿨타임을 1 줄입니다. 쓰면 줄이는 스킬, 흘려 내면 줄이는 스킬, 적을 쓰러뜨리거나 교대로 쓰면 줄이는 스킬이 있고, 스킬 설명에 적혀 있습니다. 트리 칸과 버튼 오른쪽 위에 🔄가 보입니다.',
    '스킬마다 빠르기가 있습니다. ⚡빠른 스킬은 빠른 칸을, ▶보통 스킬은 주 행동을, ⏳느린 스킬은 두 칸을 다 씁니다(도움말 "라운드와 순서").'] },
  { k: 'stats', n: '능력치', t: [
    '캐릭터를 만들 때 ' + STAT_START + '점, 레벨이 오를 때마다 ' + LV_POINTS + '점을 힘, 민첩, 지능, 체력, 의지에 나눕니다. 1점마다 규칙이 하나씩 바뀝니다. 나눌 때 "다음 1점"에 무엇이 바뀌는지 보입니다. "추천 배분"은 직업에 맞게 나눠 줍니다.',
    '힘은 1점마다 생명력 +1, 기본 공격과 강공격 피해 +1%, 내가 채우는 붕괴 게이지 +1%입니다.',
    '민첩은 1점마다 스태미나 +1, 흘리기로 줄이는 피해 +0.5%p, 빠르기 +0.5%입니다.',
    '지능은 1점마다 중독·출혈·화상 피해와 터뜨리는 피해 +2%입니다.',
    '체력은 1점마다 생명력 +3입니다.',
    '의지는 1점마다 보호막으로 얻는 양과 회복 +2%, 적이 거는 해로운 상태를 1% 확률로 버팁니다(최대 25%).',
    '같은 능력치가 10점이 될 때마다 규칙이 하나 더 붙습니다. 힘은 강공격 붕괴 +5, 민첩은 흘리기 스태미나 −1입니다.',
    '상점에서 레벨 × 10골드를 내면 지금까지 나눈 점수를 모두 거두어 처음부터 다시 나눌 수 있습니다.'] },
  { k: 'time', n: '라운드와 순서', t: [
    '전투는 라운드로 흐릅니다. 라운드마다 살아 있는 모두(나와 적)가 한 번씩 움직이고, 모두 움직이면 다음 라운드가 됩니다. 위쪽 순서 줄은 왼쪽부터 움직이는 순서이고, 이번 라운드에 이미 움직인 쪽은 ✓로 흐리게 남습니다.',
    '순서는 속도로 정합니다. 빠른 쪽이 먼저, 같으면 내가 먼저입니다. 가속이 걸리면 맨 앞, 둔화가 걸리면 맨 뒤로 갑니다. 매복을 당하면 첫 라운드에 내가 맨 뒤입니다. 속도가 1.5 이상인 적은 라운드에 두 번 움직입니다.',
    '내 차례에는 ⚡빠른 행동 1번과 ▶주 행동 1번을 합니다. 빠른 행동(플라스크, 빠른 스킬)을 먼저 쓰면 차례가 이어지고, 주 행동(기본 공격, 방어, 흘리기, 보통 스킬)을 하면 차례가 끝납니다. ⏳느린 행동(강공격, 느린 스킬)은 두 칸을 다 써서, 이번 차례에 빠른 행동을 이미 했으면 고를 수 없습니다.',
    '행동판 위의 "⚡ 빠른 행동 + ▶ 주 행동"이 이번 차례에 남은 칸입니다. 적 카드 위쪽 번호는 그 적이 이번 라운드에 몇 번째로 움직이는지입니다.',
    '행동 버튼은 왼쪽 띠로 묶음을 나눕니다. 공격은 한 줄, 스킬은 두 줄, 지키기는 점선, 회복과 그 밖은 끊긴 선, 직업 기술은 굵은 띠입니다.',
    '행동 버튼에 마우스를 올리면(휴대폰은 길게 누르면) 설명 창이 뜨고, 그 행동을 하면 내 다음 차례 전에 누가 움직이는지 미리 보여 줍니다.',
    '중독, 스태미나 회복, 보스의 시간 규칙은 라운드가 끝날 때 한 번씩 흐릅니다. 상태 옆 숫자는 세기입니다(도움말 "상태이상").'] },
  { k: 'mode', n: '가혹 모드', t: [
    '1챕터 보스를 한 번 이기면 캐릭터를 만들 때 가혹 모드를 고를 수 있습니다. 고른 모드는 그 캐릭터가 끝날 때까지 그대로입니다.',
    '가혹에서는 적과 보스가 30% 더 아프게 때립니다. 한 번에 받는 피해의 상한은 일반과 같습니다. 예고와 내 차례는 일반과 같습니다.',
    '가장 안전한 길도 일반의 큰 길만큼 위험합니다. 대신 전리품, 골드, 경험치가 늘고 장비 등급이 더 자주 오릅니다. 기록과 랭킹에 "가혹"이 붙습니다.'] },
  { k: 'goals', n: '계정 목표와 칭호', t: [
    '타이틀의 계정 목표에서 직업과 갈래마다 1 · 2 · 3챕터 보스를 넘었는지 표로 봅니다. 일반과 가혹은 따로 셉니다.',
    '보스를 이긴 판에서 트리 칸의 절반 이상을 연 갈래가 그 갈래의 기록으로 적힙니다. 사냥꾼은 기동을 뺀 피해 갈래를 셉니다. 숨겨진 직업은 열리기 전에는 ???로 보입니다.',
    '칭호는 갈래 완주, 가혹 완주, 숨겨진 직업 해금, 도감 완성입니다. 얻은 칭호 가운데 하나를 골라 두면 랭킹의 이름 옆에 보입니다.'] },
  { k: 'marks', n: '표식 도전', t: [
    '3챕터 보스를 한 번 이기면 타이틀에 표식 도전이 열립니다. 깬 챕터 하나를 고르고 표식을 걸어, 새 캐릭터로 그 챕터만 치릅니다.',
    '2챕터는 레벨 5, 3챕터는 레벨 10에서 시작합니다. 레벨만큼의 스킬 포인트와 능력치 점수를 직접 나누고, 이전 챕터의 평범 · 고급 장비 꾸러미와 약초 묶음을 받습니다.',
    '표식마다 점수가 1점에서 3점이고, 점수의 합이 기록입니다. 점수마다 정산 골드가 10% 늘어납니다. 챕터의 보스를 넘으면 끝나고, 쓰러지면 점수가 남지 않습니다. 일반 모드와 가혹 모드를 고를 수 있습니다. 랭킹에는 오르지 않고 기록 화면에 따로 남습니다.'] },
  { k: 'hp', n: '생명력', t: [
    '0이 되면 쓰러지고, 그 캐릭터는 끝납니다.',
    '전투가 끝나도 저절로 차지 않고 다음 방으로 그대로 이어집니다. 생명력 플라스크, 소모품, 샘(50%), 야영지(전부), 정산(전부)에서 회복합니다.'] },
  { k: 'mp', n: '쿨타임', t: ['0.6a.2 직업에는 마나가 없습니다. 스킬은 전투를 시작할 때 모두 사용 가능하고, 쓰면 적힌 턴만큼 기다립니다. 턴은 내 차례 한 번이고, 내 턴이 끝날 때마다 1 줍니다. 쓴 그 턴에는 줄지 않습니다. 버튼에는 "쿨타임 2턴 남음" 또는 "사용 가능"이 보입니다. "전투마다 1번"인 스킬은 전투가 끝나야 다시 씁니다.'] },
  { k: 'st', n: '스태미나', t: [

  { k: 'flask', n: '플라스크', t: [

  { k: 'act', n: '행동', t: [
    '기본 공격(▶보통): 비용 없음. 무기 피해만큼 치고 붕괴 게이지를 10 채웁니다.',
    '강공격(⏳느림): 스태미나 40. ' + Math.round(HEAVY_V2 * 100) + '% 피해 + 붕괴 35. 빠른 칸과 주 행동을 함께 써서, 이번 차례에 빠른 행동을 이미 했으면 쓸 수 없습니다.',
    '스킬: 직업 고유의 효과를 냅니다. 쓰고 나면 쿨타임만큼 기다리고, 버튼에 "쿨타임 2턴 남음" 또는 "사용 가능"이 보입니다.',
    '방어(▶보통): 스태미나 20. 내 다음 차례까지 받는 피해가 절반이 됩니다. 파수꾼은 방어할 때마다 보호막 ' + WARD.guard + '을 얻습니다(최대 생명력의 ' + Math.round(WARD.cap * 100) + '%까지, 전투가 끝나면 사라짐).',
    '흘리기(▶보통): 스태미나 30(암살자 25). 적 하나를 골라 그 적의 다음 단일 공격 피해를 60%(암살자 70%) 줄입니다. 그 공격이 강타였다면 그 적의 붕괴 게이지가 25 찹니다. 광역·지속 피해는 흘리지 못하고, 고른 적이 그 사이 움직이지 않으면 헛됩니다. 강적과 보스의 공격은 줄이는 몫이 ' + Math.round(PARRY_BIG * 100) + '%p 작습니다.',
    '도망: 보스전이 아닐 때만. 성공하면 방 밖으로 물러나고, 앞으로 가려면 그 방을 다시 이겨야 합니다. 실패하면 그대로 차례가 끝납니다.',
    '키보드: 숫자 키 1부터 9까지가 행동 버튼 앞의 번호와 같습니다. 적 차례 진행을 "한 단계씩"으로 두면 Space로 적의 다음 행동을 넘깁니다. Esc는 설명 창을 먼저 닫고, 한 번 더 누르면 열린 창을 닫습니다. 숫자 키는 설정에서 끌 수 있습니다.',
    '전투 화면에서 Tab을 처음 누르면 "행동판으로 건너뛰기" 버튼이 나타납니다. 행동 순서 줄은 Tab 한 번으로 들어가 좌우 화살표로 옮겨 다닙니다.',
    '미리보기: 행동 버튼에 초점을 두거나 마우스를 올리면(휴대폰은 길게 누르면) 맞을 적의 생명력 막대에 예상 피해가, 붕괴 막대에 오를 양이 빗금으로 겹쳐 보입니다. 카드 위에는 숫자가 뜹니다. 내 생명력 막대의 빗금은 내 다음 차례 전에 받을 피해 어림입니다.',
    '내 상태의 "정보" 버튼을 누르면 능력치, 속도, 장비, 직업 규칙을 펼칩니다. 창이 짧아 전장이 모자라면 전투 화면이 위아래로 스크롤됩니다.',
    '설정에서 글자 크기(90%부터 130%까지)와 움직임 줄이기를 고릅니다.'] },
  { k: 'cons', n: '소모품', t: [
    '쓰러뜨린 적은 정해진 확률로 골드, 소모품, 가끔 플라스크 한 칸을 떨굽니다. 전투를 이기면 받습니다. 소환된 적은 떨구지 않습니다.',
    '소모품은 🎒 버튼(플라스크 옆)에서 바로 씁니다. 차례 칸(빠른 행동 · 주 행동)을 쓰지 않고, 한 차례에 ' + CONS_TURN + '개까지 씁니다. 같은 효과는 겹치지 않습니다.',
    '소모품마다 푸는 상황이 하나씩 있습니다. 상태를 지우는 것, 적의 자세 · 예고를 푸는 것, 던지는 것, 방 특성을 끄는 것 등입니다. 같은 소모품은 정해진 수까지 한 칸에 겹칩니다.',
    '가방은 ' + BAG_MAX + '칸이고 장비와 소모품이 함께 씁니다. 상점에서 소모품을 사고 팝니다. 은화 주머니 같은 것은 팔기만 합니다.'] },
  { k: 'target', n: '대상 고르기', t: ['적 카드를 누르면 그 적이 대상이 됩니다. 카드 둘레에 두꺼운 테두리가 생기고, 행동판 위 "대상"에 그 적의 이름이 적힙니다. 고르지 않으면 공격할 수 있는 적을 자동으로 고릅니다. 닿지 않는 대상이면 행동 버튼에 이유가 뜹니다.'] },
  { k: 'intent', n: '적의 예고', t: [
    '적 카드 아래에 그 적이 다음에 할 행동이 적혀 있습니다. 강타처럼 위험한 행동은 예고 칸의 글씨가 굵어지고 테두리가 두꺼워집니다. 걸 상태도 숫자로 보입니다(예: "공격 4 · 출혈 2").',
    '충전 중 → 강타: 한 번 쉬고 다음 행동에 평소의 ' + TELE.heavy + '배 피해를 주고, 맞으면 취약 ' + EKW.heavyVuln + '가 걸립니다. 흘리기, 방어, 붕괴로 끊기, 먼저 쓰러뜨리기 가운데 고르세요.',
    '적은 매번 때리지 않습니다. 버티기(다음 행동까지 받는 피해 절반), 반격 태세(근접으로 치면 되받음), 몸 낮추기(다음에 맞는 공격 하나를 피함. 여럿을 함께 치는 공격과 지속 피해는 못 피함), 겨누기(다음 행동에 강한 한 발), 지키기(동료 대신 맞음)를 섞습니다. 버티기 · 반격 태세 · 몸 낮추기 · 지키기는 그 적이 무너지면 모두 풀립니다.',
    '치유: 사제가 생명력 ' + Math.round(PRIEST.heal * 100) + '% 아래인 동료를 25% 회복합니다. 치유할 때마다 다음 치유는 30%씩 줄어듭니다(지침). 축복: 동료의 다음 공격 피해 +25%. 저주: 나에게 약화 ' + EKW.curseWeak + '. 훔치기: 도둑이 플라스크 한 칸, 골드, 가방의 장비 가운데 하나를 훔치고 다음 행동에 달아납니다. 달아나기 전에 쓰러뜨리면 되찾습니다.',
    '영창 → 화형: 화형 사제가 영창을 시작하면 다음 행동에 화형(큰 피해와 화상 ' + CHANT.burn + ')이 옵니다. 영창하는 동안 받은 피해가 그 적 생명력의 ' + Math.round(CHANT.cut * 100) + '%가 되면 끊깁니다. 어떤 공격이든 쌓이고, 무너뜨려도 끊깁니다. 영창은 한 번에 한 적만 합니다.'] },
  { k: 'row', n: '전열과 후열', t: [
    '적은 앞줄(전열)과 뒷줄(후열)에 섭니다. 근접 공격(기본 공격, 강공격, 근접 스킬)은 전열만 노릴 수 있습니다. 전열이 모두 쓰러지거나 붕괴하면 근접 공격도 후열에 닿습니다.',
    '원거리와 광역 스킬은 언제나 닿습니다. 다만 광역 스킬은 후열에 70%만 들어갑니다.',
    '방패벽: 방패병이 서 있으면 후열이 받는 광역 피해가 다시 절반이 되고, 옆 전열 동료도 광역·전열 전체 피해를 40% 덜 받습니다(카드에 🛡️). 방패병 자신도 광역 피해를 25% 덜 받습니다. 방패병을 쓰러뜨리거나 붕괴시키면 풀립니다.',
    '스킬 설명의 숫자가 실제로 걸리는 숫자입니다. 여럿에게 거는 스킬은 이미 줄인 숫자로 적혀 있습니다.'] },
  { k: 'break', n: '붕괴', t: [
    '적 카드의 보라색 게이지입니다. 기본 공격 10, 강공격 35씩 차고, 가득 차면 붕괴합니다. 터뜨리는 스킬은 중독 수치만큼 게이지를 채우기도 합니다.',
    '붕괴한 적은 충전 중이던 강타가 취소되고, 다음 행동을 잃고, 취약 2가 걸립니다. 붕괴 상태는 다음 라운드가 끝날 때까지 남습니다. 방패병을 붕괴시키면 잠시 동료를 지키지 못하고 방패벽도 풀립니다.',
    '보스는 게이지가 커서 즉석으로 끊기 어렵습니다. 미리 채워 두었다가 원하는 순간에 끊으세요.'] },
  { k: 'roles', n: '적의 역할', t: [
    '돌격병(전열): 공격 → 버티기 → 강타 준비 → 강타. 방패병(전열): 동료를 노린 근접 공격을 대신 맞고, 서 있는 동안 방패벽으로 동료가 받는 광역 피해를 줄입니다. 공격 → 버티기 → 반격 태세 → 버티기.',
    '사수(후열): 겨누기 → 겨눈 한 발(가끔 출혈 ' + EKW.archerBleed + ') → 몸 낮추기. 사제(후열): 다친 동료를 치유하고, 아니면 축복을 겁니다. 소환사(후열): 하수인 부르기 → 저주 → 공격. 하수인(전열): 소환사가 있으면 하나가 소환사를 지키고 나머지는 공격합니다. 자폭병(전열): 준비한 뒤 터집니다.',
    '도둑(전열): 몸 낮추기 → 훔치기 → 달아나기. 암흑술사(후열): 저주 → 어둠 화살.',
    '2챕터 해골 병사(전열): 쓰러지면 뼈 더미가 되고, 더미 위 숫자만큼 라운드가 지나면 한 번 다시 일어섭니다. 화상이 걸렸거나 무너진 채 쓰러지면 일어서지 않습니다. 남은 적이 뼈 더미뿐이면 전투가 끝납니다.',
    '2챕터 무덤 주술사(후열): 저주(약화 1 · 취약 1) → 조이기 → 어둠 화살. 조이기는 내 해로운 상태(중독 · 출혈 · 화상 · 약화 · 취약)가 여러 가지일수록 아픕니다. 뼈 쌓는 자(후열): 뼈벽을 쌓고 보강합니다. 뼈벽이 서 있으면 후열 적은 한 적을 노린 공격을 절반만 받습니다. 뼈벽은 붕괴에 약합니다.',
    '2챕터 굴 파는 시체(전열): 땅속으로 파고들면 한 적 대상으로 고를 수 없고, 광역 · 지속 피해만 들어갑니다. 다음 행동에 솟구치고(예고가 보입니다), 솟구친 뒤에는 드러나 취약해집니다. 부푼 시체(전열): 쓰러지면 터져 나와 다른 적 모두에게 중독을 퍼뜨립니다. 불에 타면 터지지 않습니다.',
    '2챕터 정예 가운데 신속이 붙은 적은 라운드가 시작될 때 가속 1을 얻어 맨 앞에서 움직입니다. 둔화가 걸려 있으면 가속을 얻지 못합니다.',
    '3챕터 모래 잠복자(전열): 모래 속으로 숨으면 땅속의 적처럼 한 적 대상으로 고를 수 없고, 광역 · 지속 피해만 들어갑니다(광역은 더 아프게). 다음 행동에 솟구치고(예고가 보입니다) 출혈 ' + LURK.bleed + '을 겁니다. 솟구친 뒤에는 취약해지고 한 행동 숨을 고릅니다. 한 전투에 숨는 일반 적은 하나뿐입니다.',
    '3챕터 붕대 감긴 망자(전열): 붕대가 받는 직접 피해를 ' + Math.round(WRAP.cut * 100) + '% 줄입니다. 지속 피해는 줄이지 않습니다. 화상이 걸리거나 무너지거나 세 번 맞으면 벗겨지고, 한 번은 다시 감으려 합니다(예고가 보입니다). 불씨 투척병(후열): 불단지(화상 ' + EMBER.potIgn + ') → 불씨 나누기(동료의 다음 공격에 화상 ' + EMBER.share + ') → 공격.',
    '3챕터 아지랑이 술사(후열): 동료에게 허상 ' + HAZE.give + ', 자기에게 허상 ' + HAZE.self + '을 두릅니다. 허상 한 겹은 적 하나를 고르는 공격 하나를 헛치게 하고 걷힙니다. 광역 · 지속 피해는 허상을 지나갑니다. 술사가 쓰러지면 술사가 준 허상이 사라지고, 적이 무너지면 그 적의 허상이 모두 사라집니다.',

/* ===== 계정 목표 · 칭호 · 표식 도전 (10월 8일, docs/가혹모드-반복.md 2절) =====

const goalKey = (build, br, ch) => build + '|' + br + '|' + ch;
const statStartPts = run => STAT_START + (run && run.markStat ? run.markStat : 0);
function goalBranch(run) {
  const T = TREE2[run.build], t = run.tree; if (!T || !t || !t.open.length) return null;
  const cnt = {}; for (const id of t.open) { const sk = SK2[id]; if (sk && sk.b) cnt[sk.b] = (cnt[sk.b] || 0) + 1; }
  const by = list => list.slice().sort((x, y) => (cnt[y] || 0) - (cnt[x] || 0))[0];
  let main, base = t.open.length;
  if (run.build === 'hunter') { // 사냥꾼: 기동은 피해 갈래와 함께 여는 갈래라, 기동을 뺀 피해 갈래를 주로 센다

}

  if (br) { const k = goalKey(run.build, br, ch); if (!g[m][k]) { g[m][k] = Date.now(); news = BUILDS[run.build].n + ' ' + br + ' ' + ch + '챕터' + (m === 'h' ? ' 가혹' : ''); } }
  if (ch >= 3) G.data.markOpen = 1;

}

/* 표식 도전 시작: startRun이 G.cre.mark가 있을 때 부른다(캐릭터 만들기 화면과 자동 테스터가 같은 함수를 쓴다). 챕터 시작 레벨 · 트리 포인트 · 능력치 점수 · 장비 꾸러미 */

  return `<div class="bgrid"><div class="btop">${status}<div class="bmid">${vOrder(b)}${gim}<div class="logrow">${lastl}<span class="logbtns"><button class="sm rulebtn" data-a="help" data-k="row" aria-label="전투 규칙">❔<span class="lbt"> 전투 규칙</span></button><button class="sm onlym logbtn" data-a="logopen" aria-label="전투 기록">📜<span class="lbt"> 기록</span></button></span></div></div></div>${field}${dock}${side}</div>`;

/* ===== 표시 규칙: T 숨기기, 순서·빠르기·남은 차례 + 설명 창 ===== */
/* 빌드 자원: 항상 보이게 */
function buildRes(p) {
  if (p.build === 'berserker') { const rt = p.s && p.s.rage ? '<b class="rg">격노</b>' : `<span class="pips" role="img" aria-label="분노 ${p.rage}/10">${'●'.repeat(p.rage)}${'○'.repeat(Math.max(0, 10 - p.rage))}</span>`; return `<div class="bres"><span class="rgw" data-info="rage" tabindex="0">분노 ${rt}</span></div>`; }
  if (!(scarRate(p) > 0)) return '';
  const mx = Math.round(p.hpMax * 0.5), w = mx ? Math.min(100, p.scar / mx * 100) : 0;
  const rageTxt = p.s && p.s.rage ? '<b class="rg">격노</b>' : `<span class="pips" role="img" aria-label="분노 ${p.rage}/10">${'●'.repeat(p.rage)}${'○'.repeat(Math.max(0, 10 - p.rage))}</span>`;
  return `<div class="bres"><div class="mb" data-info="scar" tabindex="0"><div class="bar sc" role="progressbar" aria-label="상흔" aria-valuemin="0" aria-valuemax="${mx}" aria-valuenow="${Math.round(p.scar)}"><i style="width:${w}%"></i><span>상흔 ${Math.round(p.scar)}/${mx}</span></div></div></div>`;
}
function dmgMult(p) { let m = 1; if (p.eq.ring1 === 'pulse' || p.eq.ring2 === 'pulse') m *= 1.35; if (p.s.weak) m *= 0.75; if (p.s.rage) m *= 1.4; if (p.build === 'berserker' && p.rage) m *= 1 + p.rage * 0.03; return m; }
/* 지금 쓰면 나올 값 */
/* 숨겨진 직업 1의 버튼 미리보기: 먹기 · 출혈 비례 · 받은 피해 · 내 생명력 조건 · 나에게 출혈 */
function buHint(b, a) {
  const p = b.p, f = a.s.fx, out = []; const t = actTarget(b, a); const bl = e => e ? stk(e, 'bleed') : 0;
  const md = f.find(e => e.k === 'drain' && e.s === 'bleed' && e.me); if (md) out.push(bl(p) ? '내 출혈 ' + bl(p) + ' 거둠' : '거둘 내 출혈 없음');
  const ms = f.find(e => e.k === 'meSt' && e.s === 'bleed'); if (ms) out.push('나에게 출혈 ' + ms.n);
  const dr = f.find(e => e.k === 'drain' && e.s === 'bleed' && !e.me && !e.kill);
  if (dr && !a.aoe) { const n0 = bl(t); const n = dr.max ? Math.min(dr.max, n0) : dr.half ? Math.ceil(n0 / 2) : n0; if (!n) out.push('먹을 출혈 없음'); else { const v = n * dr.per * healMul(p); const room = Math.min(Math.max(0, Math.min(p.hpMax, p.hpFight != null ? p.hpFight : p.hpMax) - p.hp), buEatLeft(b)); out.push('출혈 ' + n + ' 먹음 → +' + r1(v) + (room < v ? '(한도까지 ' + r1(room) + ')' : '')); } }
  const ex = f.find(e => e.k === 'exploit' && e.s === 'bleed'); if (ex && (ex.me || !a.aoe)) { const n = ex.me ? Math.min(ex.max || 10, bl(p)) : bl(t); out.push((ex.me ? '내 출혈 ' : '출혈 ') + n + ' → +' + r1(n * ex.per)); }
  const gr = f.find(e => e.k === 'grudge'); if (gr) { const g = buGrudgeNow(b); out.push(g > 0 ? '받은 피해 ' + Math.round(g) + ' → +' + r1(Math.min(gr.max || 999, gr.per * g)) : '맞은 피해 없음'); }
  const lx = f.find(e => e.k === 'lowx' && e.me); if (lx) out.push(p.hp <= p.hpMax * lx.hp ? '×' + lx.mul + ' 듦' : '안 듦(내 생명력 ' + Math.round(p.hp / p.hpMax * 100) + '%)');
  if (t && !a.self && isMeleeAct(p, a.id) && bl(t) > 0 && f.some(e => e.k === 'dmg')) out.push('흡혈 ' + Math.round(Math.min(BUTCH.leechMax, BUTCH.leech * bl(t)) * 100) + '%');
  return out.join(' · ');
}
/* 마검사 버튼 아랫줄: 교대면 "⇄ +4"(이번 차례 직업 보호막 전) · "⇄", run 2가 켜지면 "⇄⇄", 칼이 실린 베기는 "칼: 출혈 5", 상태 조건 · 비례 미리보기 */
function sbHint(b, a) {
  const p = b.p; if (p.build !== 'spellblade' || !a) return ''; const k = sbKindOf(p, a.id, a); if (!k) return ''; const out = [];
  const alt = !!p.sbLast && k !== p.sbLast; const run = alt ? (p.sbRun || 0) + 1 : 0; const F = kk => a.v2 && a.s ? a.s.fx.find(e => e.k === kk) : null; const af = F('alt');
  if (af && af.run === 2 && run >= 2) out.push('⇄⇄'); else if (alt) out.push(b.sbAltTurn !== b.turnIdx ? '⇄ +' + ((BUILDS.spellblade || {}).altWard || 0) : '⇄');
  if (k === 'cut' && p.edge) { const ex = F('edgeX'); out.push('칼: ' + KW_N[p.edge.s] + ' ' + Math.min(KW[p.edge.s] || 10, Math.round(p.edge.n * (ex ? ex.mul : 1)))); }
  const t = !a.self && !a.aoe ? actTarget(b, a) : null;
  if (t) { const kx = F('kwx'), ex = F('exploit'); if (kx && st(t, kx.s) > 0) out.push(KW_N[kx.s] + ' ×' + kx.mul); if (ex && ex.s && st(t, ex.s) > 0) out.push('+' + r1(ex.per * st(t, ex.s)) + ' (' + KW_N[ex.s] + ' ' + st(t, ex.s) + ')'); }

/* 적 카드의 읽는 이름에 넣을 상태 낱말 (중독 4, 취약 2 …) */
function stsWords(u, b) {

/* 적 카드 위 순번: 이번 라운드에 남은 줄에서 몇 번째로 움직이는가 (나를 빼고 1부터). 비면 이번 라운드에는 이미 움직였다 */
function enSlots(b, e) {
  const q = (b.queue || []).filter(id => id === 'p' || (b.en.find(x => x.id === id) || {}).alive);
  const L = []; let k = 0; for (const id of q) { if (id === 'p') continue; k++; if (id === e.id) L.push(k); }
  return L;
}
function eordText(b, e) { const L = enSlots(b, e); return L.length ? '이번 라운드 ' + L.join('·') + '번째로 움직임' : '이번 라운드에는 이미 움직임'; }

}
/* 적 생명력: 굵은 막대 + 큰 숫자. 30% 아래면 붉게 */
function ehpBar(e) { const r = e.hpMax > 0 ? Math.max(0, Math.min(1, e.hp / e.hpMax)) : 0; return `<span class="bar hp ehp${r <= 0.3 ? ' lo' : ''}" role="progressbar" aria-label="생명력" aria-valuemin="0" aria-valuemax="${Math.round(e.hpMax)}" aria-valuenow="${shownHp(e.hp)}"><i style="width:${r * 100}%"></i><span><b>${shownHp(e.hp)}</b> / ${Math.round(e.hpMax)}</span></span>`; }
/* 이번 차례에 남은 칸: ⚡ 빠른 행동(먼저) + ▶ 주 행동(차례를 끝냄) */
function slotHtml(b) {

  return `<span class="slots" data-info="slots" tabindex="0" role="group" aria-label="이번 차례에 남은 칸: ${f ? '빠른 행동과 ' : ''}주 행동"><span class="slot${f ? ' on' : ' used'}">⚡ ${nf ? '빠른 칸 없음' : '빠른 행동' + (f ? '' : ' 씀')}</span><span class="pl" aria-hidden="true">+</span><span class="slot on">▶ 주 행동</span></span>`;

/* 순서표 (숫자 없이) */
function vOrder(b) {
  const tl = preview(b); const rN = b.round || 1;
  const all = b.roundAll || [], q0 = b.queue || []; const dn = all.length >= q0.length && all.slice(all.length - q0.length).join() === q0.join() ? all.slice(0, all.length - q0.length) : [];
  const dnLis = dn.map(id => { const e = id === 'p' ? null : b.en.find(y => y.id === id); return id === 'p' || e ? `<li class="dn${id === 'p' ? ' me' : ''}" aria-label="${esc(id === 'p' ? '나' : e.n)}: 이번 라운드에 움직임 끝">✓ ${e ? e.ico + ' ' + esc(e.n) : '나'}</li>` : ''; }).join('');

    const e = x.me ? null : b.en.find(y => y.id === x.id);
    lis += `<li class="${[x.me ? 'me' : '', x.now ? 'now' : '', x.r > rN ? 'nx' : ''].filter(Boolean).join(' ')}" data-info="tl:${i}" tabindex="${i === 0 ? 0 : -1}">${e ? e.ico + ' ' : ''}${esc(x.me ? '나' : x.n)}</li>`;

function scenAxes(b) {
  const acts = b.rec.filter(x => x.k === 'act');
  const first = (acts.find(x => x.tg && !['guard', 'dodge', 'flaskL', 'flaskM'].includes(x.a)) || {}).tg || null;
  const deliberate = []; let last = null;
  for (const x of b.rec) { if (x.k === 'act') last = x; if (x.k === 'hit' && x.charged && x.d > 0 && last && last.canDodge && !['dodge', 'guard'].includes(last.a)) deliberate.push({ t: x.t, src: x.src }); }
  const stopI = acts.findIndex(x => ['guard', 'flaskL', 'flaskM', 'dodge'].includes(x.a));
  return { first, deliberate: deliberate.length, stopAt: stopI < 0 ? null : stopI + 1, stopWhat: stopI < 0 ? null : acts[stopI].a, actions: acts.map(x => x.a) };
}
async function scenNext() {
  const S = G.scen; const b = G.b; const sc = SCEN[S.i];
  S.results.push(Object.assign({ id: sc.id, over: b.over || 'open' }, scenAxes(b)));
  S.i++;
  if (S.i >= SCEN.length) {
    G.data.scen[S.build] = { build: S.build, at: Date.now(), results: S.results }; saveLocal();
    G.b = null; G.scr = 'title'; render();
    await pushDb(COL.scen + '/' + S.build, G.data.scen[S.build]); G.scen = null; render(); return;

const PACE = { step: -1, slow: 1600, normal: 1000, fast: 450, instant: 0 };
const PACEN = { step: '한 단계씩', slow: '느리게', normal: '보통', fast: '빠르게', instant: '즉시' };
const sleep = ms => new Promise(r => setTimeout(r, ms));
function waitStep() { return new Promise(r => { G.stepResolve = r; render(); }); }
function actTarget(b, a) {
  if (a.self || a.aoe) return null;
  const sel = G.sel ? b.en.find(e => e.id === G.sel && e.alive) : null;
  if (sel && canTarget(b, sel, a) && !(a.id === 'dodge' && sel.role === 'root')) return sel;
  return autoTarget(b, a);
}
function doAct(id, tid) {
  const b = G.b; if (!b || b.over || G.busy) return;
  const acts = actionList(b); const a = acts.find(x => x.id === id);
  if (!a || !a.ok) return;
  const t = tid ? b.en.find(e => e.id === tid && e.alive) : actTarget(b, a);
  G.liveMk = { b, x: b.log[b.log.length - 1] };
  commitAct(id, t ? t.id : null);
  playerAct(b, id, t ? t.id : null);
  if (G.sel && !(b.en.find(e => e.id === G.sel) || {}).alive) G.sel = null;
  liveSay(liveNew(b), true);
  if (b.waiting) animate(b); else afterTurn(b);
}
function afterTurn(b) {
  if (G.b === b) saveBattle();
  if (G.scr === 'tut') tutCheck(b);
  if (G.scr !== 'tut' && !G.data.seenBreak && b.rec.some(x => x.k === 'break')) { G.data.seenBreak = true; saveLocal(); setTimeout(() => openSheet('help', { k: 'break', first: 1 }), 50); }
  if (G.scr === 'scen') { b.pActs = (b.pActs || 0) + 1; if (b.pActs >= 10 && !b.over) b.over = 'open'; }
  render();
}
/* 다음에 움직일 적 (알림용): 이번 라운드 줄의 맨 앞, 줄이 비었으면 다음 라운드의 맨 앞 */
function nextActor(b) {
  const head = (b.queue && b.queue.length) ? b.queue[0] : (roundOrder(b, false)[0] || {}).id;
  if (!head || head === 'p') return null;
  const e = b.en.find(x => x.id === head); return e && e.alive && e.role !== 'root' ? e : null;
}
/* 적이 한 명씩: 먼저 "누가 무엇을 한다"를 알리고, 그다음 결과를 보여준다 */
async function animate(b) {
  G.busy = true; G.skip = false; hidePop();
  const pace = () => G.skip ? 0 : PACE[G.pace || 'normal'];
  const wait = async (f) => { const v = pace(); if (v < 0) await waitStep(); else if (v) await sleep(v * f); };
  G.banner = null; render(); if (pace() > 0) await wait(0.5);
  while (b.waiting && G.b === b) {
    const nx = nextActor(b);
    if (nx) {
      G.banner = { who: nx.n, ico: nx.ico, what: nx.stun > 0 ? '😵 비틀거려 행동을 놓친다' : (() => { const ib = intentBadge(b, nx); return ib.ico + ' ' + ib.txt + (ib.num !== '' ? ' ' + ib.num : ''); })(), id: nx.id, phase: 'pre' };
      b.lastActor = nx.id; render(); await wait(0.55);
      if (G.b !== b) break;
    }
    const r = stepWorld(b);
    if (nx && G.banner) G.banner.phase = 'post';
    liveSay(liveNew(b));
    render();
    if (r === 'acted' && pace() > 0) await wait(0.75);
  }
  b.lastActor = null; G.banner = null; G.busy = false; G.skip = false; G.stepResolve = null;
  if (!b.over && G.b === b) liveSay('내 차례입니다');
  if (!b.over) { G.myTurnFlash = true; setTimeout(() => { G.myTurnFlash = false; const el = document.querySelector('.turnban.me'); if (el) { const last = G.b && G.b.log[G.b.log.length - 1]; el.outerHTML = last ? `<div class="lastlog ${last.c}">${esc(last.m)}</div>` : ''; } }, 900); }
  afterTurn(b);
}

/* ===== 0.6a.2 스킬 트리 화면 (10월 3일 만든 사람 요청) =====
   원형 칸이 기본 → 중급 → 상급 → 궁극으로 아래로 가지처럼 뻗고, 부모와 선으로 잇는다. 칸에 마우스를 올리면 설명창, 누르면 아래 상세 칸.
   보이는 범위는 treeVis(기본·부모가 열린 칸은 다 보이고, 궁극은 이름만, 나머지는 ?). 휴대폰은 갈래 탭, PC는 세 갈래를 나란히.
   쓰는 곳: 캐릭터 만들기의 스킬 단계(mode 'create'), 따로 보는 페이지 'tree'(메뉴·지도). 전투 중에는 보기만 한다 */
const TIERS2 = ['하급', '중급']; // 상급·궁극은 지웠다(2챕터까지의 반응을 보고 3챕터부터 더한다)
const TREE_ROW_H = 82, TREE_TOP = 38;
function treeLayout(build, br, tiers) {
  const all = SKILLS2[build].filter(s => s.b === br && !s.start && (tiers || TIERS2).includes(s.tier)); const pos = {};
  const nums = [...new Set(all.map(s => s.row || 1))].sort((a, b) => a - b);
  const rows = nums.map(n => all.filter(s => (s.row || 1) === n));

async function readTester(id) {
  const [rs, ss, fs, ms, bs] = await Promise.all([G.db.collection('playtest/' + id + '/' + COL.runs).get(), G.db.collection('playtest/' + id + '/' + COL.scen).get(), G.db.doc('playtest/' + id + '/' + COL.survey + '/final').get(), G.db.doc('playtest/' + id).get(), G.db.doc('board/' + id).get().catch(() => ({ exists: false }))]);
  const runs = [];
  for (const d of rs.docs) {
    const r = Object.assign({}, d.data());
    if (!r.acts && r.chunks) {
      const cs = await G.db.collection('playtest/' + id + '/' + COL.runs + '/' + d.id + '/acts').get();
      r.acts = cs.docs.map(x => x.data()).sort((x, y) => x.i - y.i).reduce((acc, x) => acc.concat(x.a || []), []);
    }
    runs.push(r);

  return { uid: id, name: meta.name || (bs.exists ? (bs.data() || {}).name : '') || '', login: meta.login || '', runs, scen: ss.docs.map(x => x.data()), final: fs.exists ? fs.data() : null };
}

function collectNotes(testers) {

      const ctx = { who, build: r.build, run: bossN[r.boss] || r.boss, at: r.endedAt || r.updatedAt || r.startedAt };
      if (r.survey) {
        if (r.survey.dilemma || r.survey.note) out.push(Object.assign({}, ctx, { type: 'survey', where: '판 설문', label: r.survey.dilemma === 'yes' ? '고민 있었음' : r.survey.dilemma === 'no' ? '고민 없었음' : '', text: r.survey.note || '' }));

        out.push(Object.assign({}, ctx, { type: 'swap', where: (s.room ? floorName(s.room) + ' 들어가기 전' : '') + (s.ctx === 'block' ? ' · 막힘 선택' : s.ctx === 'free' ? ' · 자발' : ''), label: (s.on ? '장착 ' : '해제 ') + (ITEMS[s.item] ? ITEMS[s.item].n : s.item) + (why ? ' · ' + why : ''), text: s.note || '', at: s.t || ctx.at }));
